<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - LabVirtual W</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="auth.js"></script>
    <style>
        :root {
            --color-fisica: #3498db;   
            --color-oscuro: #1a1a2e;
            --color-texto: #ffffff;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body {
            background-color: var(--color-oscuro); color: var(--color-texto);
            background-image: linear-gradient(rgba(26, 26, 46, 0.9), rgba(26, 26, 46, 0.95)), url('https://images.unsplash.com/photo-1532094349884-543bc11b234d?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');
            background-size: cover; display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        .auth-container {
            background: rgba(20, 20, 35, 0.85); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px; border-radius: 15px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            animation: fadeIn 0.5s ease;
        }
        .logo-icono { font-size: 3rem; color: var(--color-fisica); margin-bottom: 10px; }
        h1 { font-size: 1.8rem; margin-bottom: 20px; }
        .input-group { margin-bottom: 20px; text-align: left; position: relative; }
        .input-group i { position: absolute; left: 15px; top: 15px; color: #888; }
        .input-group input {
            width: 100%; padding: 12px 15px 12px 45px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.2);
            color: #fff; border-radius: 8px; font-size: 1rem; outline: none; transition: 0.3s;
        }
        .input-group input:focus { border-color: var(--color-fisica); background: rgba(0,0,0,0.5); }
        .btn-submit {
            width: 100%; padding: 12px; background: var(--color-fisica); color: #fff; border: none; border-radius: 8px;
            font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: 0.3s; margin-top: 10px;
        }
        .btn-submit:hover { background: #2980b9; transform: translateY(-2px); }
        .btn-submit:disabled { background: #555; cursor: not-allowed; transform: none; }
        
        .links-bottom { margin-top: 20px; font-size: 0.9rem; }
        .links-bottom a { color: var(--color-fisica); text-decoration: none; font-weight: 600; transition: 0.3s; }
        .links-bottom a:hover { color: #fff; }
        .error-msg { color: #e74c3c; font-size: 0.9rem; margin-bottom: 15px; display: none; }
        
        .volver-inicio { position: absolute; top: 20px; left: 20px; color: #fff; text-decoration: none; font-size: 1.2rem; transition: 0.3s; }
        .volver-inicio:hover { color: var(--color-fisica); }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <a href="index.html" class="volver-inicio"><i class="fa-solid fa-arrow-left"></i> Inicio</a>

    <div class="auth-container">
        <i class="fa-solid fa-flask logo-icono"></i>
        <h1>Iniciar Sesión</h1>
        <p style="color: #aaa; font-size: 0.9rem; margin-bottom: 25px;">Ingresa para acceder a las prácticas y evaluaciones de LabVirtual W.</p>
        
        <div id="error-msg" class="error-msg"></div>

        <form id="login-form">
            <div class="input-group">
                <i class="fa-solid fa-user"></i>
                <input type="text" id="usuario" placeholder="Usuario" required autocomplete="username">
            </div>
            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="contrasena" placeholder="Contraseña" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn-submit" id="btn-login">Entrar</button>
        </form>

        <div class="links-bottom">
            <p><a href="recuperar.html">¿Olvidaste tu contraseña?</a></p>
            <p style="margin-top: 10px; color: #aaa;">¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
        </div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-login');
            const errorMsg = document.getElementById('error-msg');
            const user = document.getElementById('usuario').value;
            const pass = document.getElementById('contrasena').value;

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Verificando...';
            errorMsg.style.display = 'none';

            try {
                const res = await window.LabAuth.login(user, pass);
                if (res.success) {
                    btn.innerHTML = '<i class="fa-solid fa-check"></i> ¡Éxito!';
                    btn.style.background = '#2ecc71';
                    setTimeout(() => { window.location.href = 'index.html'; }, 1000);
                } else {
                    errorMsg.textContent = res.message;
                    errorMsg.style.display = 'block';
                    btn.disabled = false;
                    btn.innerHTML = 'Entrar';
                }
            } catch (err) {
                errorMsg.textContent = "Error de conexión. Intenta de nuevo.";
                errorMsg.style.display = 'block';
                btn.disabled = false;
                btn.innerHTML = 'Entrar';
            }
        });
    </script>
</body>
</html>
