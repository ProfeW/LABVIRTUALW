<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Práctica: Movimiento Parabólico - LabVirtual W</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>??</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --color-tema: #3498db; --color-oscuro: #1a1a2e; --color-exito: #2ecc71; --color-error: #e74c3c; }
        html { scroll-behavior: smooth; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--color-oscuro); color: #fff; background-image: linear-gradient(rgba(26, 26, 46, 0.9), rgba(26, 26, 46, 0.95)), url('https://images.unsplash.com/photo-1532094349884-543bc11b234d?auto=format&fit=crop&w=1920&q=80'); background-size: cover; background-attachment: fixed; min-height: 100vh; }
        nav { background: rgba(0,0,0,0.3); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(52, 152, 219, 0.2); display: flex; justify-content: space-between; align-items: center; padding: 15px 50px; position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 24px; font-weight: 800; color: #fff; display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .logo i { color: var(--color-tema); }
        .menu { list-style: none; display: flex; gap: 20px; }
        .menu a { color: #fff; text-decoration: none; font-weight: 600; padding: 10px 15px; border-radius: 5px; transition: 0.3s; display: flex; align-items: center; gap: 8px; }
        .menu a:hover { background: rgba(52, 152, 219, 0.1); color: var(--color-tema); }
        .contenedor { max-width: 960px; margin: 40px auto; padding: 20px; animation: fadeIn 0.5s ease; }
        .btn-volver { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 20px; color: var(--color-tema); text-decoration: none; font-weight: 600; transition: 0.3s; }
        .btn-volver:hover { color: #fff; transform: translateX(-5px); }
        .encabezado-leccion { border-bottom: 2px solid rgba(52, 152, 219, 0.4); padding-bottom: 20px; margin-bottom: 30px; text-align: center; }
        .encabezado-leccion h1 { font-size: 2.8rem; color: var(--color-tema); margin-bottom: 8px; }
        .encabezado-leccion p { color: #aaa; font-size: 1.1rem; }
        
        .barra-progreso-contenedor { background: rgba(255,255,255,0.05); border-radius: 10px; padding: 20px; margin-bottom: 30px; border: 1px solid rgba(255,255,255,0.08); }
        .barra-progreso-titulo { font-weight: 700; color: #fff; margin-bottom: 10px; display: flex; justify-content: space-between; }
        .barra { background: rgba(255,255,255,0.1); border-radius: 20px; height: 10px; overflow: hidden; }
        .barra-fill { background: linear-gradient(90deg, var(--color-tema), #9b59b6); height: 100%; border-radius: 20px; transition: width 0.5s ease; width: 0%; }

        .ejercicio-box { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 30px; margin-bottom: 40px; border-top: 4px solid var(--color-tema); }
        .ejercicio-box.semi { border-top-color: #e74c3c; }
        .ejercicio-box.para { border-top-color: #2ecc71; }
        .ejercicio-box h3 { margin-bottom: 10px; font-size: 1.3rem; display: flex; align-items: center; gap: 10px; }
        .ejercicio-box.semi h3 { color: #e74c3c; }
        .ejercicio-box.para h3 { color: #2ecc71; }

        .enunciado { font-style: italic; color: #ddd; background: rgba(0,0,0,0.3); padding: 15px; border-radius: 8px; margin-bottom: 20px; font-size: 1.05rem; border-left: 4px solid #3498db; line-height: 1.6; }
        .paso-contenedor { background: rgba(0,0,0,0.4); padding: 25px; border-radius: 8px; margin-bottom: 12px; border-left: 3px solid #444; transition: 0.3s; }
        .paso-contenedor.activo { border-left-color: var(--color-tema); box-shadow: 0 5px 15px rgba(52, 152, 219, 0.1); }
        .paso-contenedor.completado { border-left-color: var(--color-exito); opacity: 0.7; pointer-events: none; }
        .paso-titulo { font-weight: 800; color: #fff; font-size: 1rem; text-transform: uppercase; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .icono-check { color: var(--color-exito); display: none; font-size: 1.2rem; }
        .completado .icono-check { display: block; }
        .oculto { display: none; }
        
        .grid-datos { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 15px; }
        .input-grupo { display: flex; align-items: stretch; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; overflow: hidden; }
        .input-grupo label { background: rgba(0,0,0,0.5); padding: 10px; color: #fff; font-weight: bold; min-width: 45px; text-align: center; border-right: 1px solid rgba(255,255,255,0.1); }
        .input-grupo input { flex: 1; padding: 10px; border: none; background: transparent; color: #fff; font-size: 1.05rem; text-align: center; outline: none; width: 100%; }
        .input-grupo .unidad { background: rgba(52, 152, 219, 0.15); padding: 10px; font-size: 0.85rem; color: var(--color-tema); border-left: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; }
        
        select { width: 100%; padding: 13px 15px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); background: rgba(20,20,35,0.8); color: #fff; font-size: 1rem; outline: none; margin-bottom: 5px; cursor:pointer;}
        select:focus { border-color: var(--color-tema); }
        .btn-validar { background: var(--color-tema); color: #fff; border: none; padding: 12px 28px; border-radius: 6px; font-weight: 700; cursor: pointer; transition: 0.3s; display: inline-flex; align-items: center; gap: 8px; margin-top:10px; }
        .btn-validar:hover { opacity: 0.85; transform: translateY(-2px); }
        .feedback { display: none; margin-top: 12px; padding: 12px 18px; border-radius: 6px; font-weight: 600; font-size: 0.95rem; }
        .feedback.correcto { display: block; background: rgba(46,204,113,0.15); border: 1px solid var(--color-exito); color: var(--color-exito); }
        .feedback.incorrecto { display: block; background: rgba(231,76,60,0.15); border: 1px solid var(--color-error); color: var(--color-error); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
    <style>
        body {
            padding-top: max(5mm, env(safe-area-inset-top)) !important;
            padding-bottom: max(5mm, env(safe-area-inset-bottom)) !important;
        }
    </style>
</head>
<body>

<nav>
    <a href="index.html" class="logo"><i class="fas fa-microscope"></i> LabVirtual W</a>
    <ul class="menu">
        <li><a href="index.html"><i class="fas fa-home"></i> Inicio</a></li>
        <li><a href="fisica_10.html"><i class="fas fa-atom"></i> Física 10</a></li>
        <li><a href="fisica10_parabolico.html"><i class="fas fa-arrow-left"></i> Volver a Lección</a></li>
    </ul>
</nav>

<div class="contenedor">
    <a href="fisica10_parabolico.html" class="btn-volver"><i class="fas fa-arrow-left"></i> Volver a la Lección</a>

    <div class="encabezado-leccion">
        <h1>?? Práctica: Movimiento Parabólico</h1>
        <p>10 Ejercicios en cascada (5 Semiparabólicos y 5 Parabólicos completos). (Usa g = 10 m/s²)</p>
    </div>

    <div class="barra-progreso-contenedor">
        <div class="barra-progreso-titulo">
            <span>?? Progreso General</span>
            <span id="texto-progreso">0 / 10 ejercicios completados</span>
        </div>
        <div class="barra"><div class="barra-fill" id="barra-fill"></div></div>
    </div>

    <div id="ejercicios-container"></div>
    
    <div style="text-align:center; margin-top:30px;">
        <a href="fisica10_parabolico_evaluacion.html" class="btn-validar" style="background:#e74c3c; font-size:1.2rem; padding:15px 30px;"><i class="fa-solid fa-file-signature"></i> Ir a Evaluación</a>
    </div>

</div>

<script>
    const ejerciciosData = [
        // SEMIPARABÓLICO (1 al 5)
        {
            tipo: 'semi', titulo: "Ejercicio 1 (Semiparabólico: Tiempo de Vuelo)",
            enunciado: "Una piedra es lanzada horizontalmente desde un acantilado de 20 m de altura. ¿Cuánto tiempo tarda en caer? (Usa g = 10 m/s²).",
            datos: [{id:'y', label:'y', val:20, u:'m'}, {id:'g', label:'g', val:10, u:'m/s²'}],
            formulaOptions: [{v:'correcta', t:'t = v(2y / g)', c:true}, {v:'incorrecta', t:'t = (2y) / g', c:false}],
            calculo: {id:'t', label:'t', val:2, u:'s'} // sqrt(40/10) = 2
        },
        {
            tipo: 'semi', titulo: "Ejercicio 2 (Semiparabólico: Alcance horizontal)",
            enunciado: "Si el objeto del ejercicio anterior fue lanzado con una velocidad horizontal de 5 m/s y el tiempo de caída es 2 s. ¿Cuál es su alcance máximo (x)?",
            datos: [{id:'Vox', label:'Vox', val:5, u:'m/s'}, {id:'t', label:'t', val:2, u:'s'}],
            formulaOptions: [{v:'incorrecta', t:'x = Vox / t', c:false}, {v:'correcta', t:'x = Vox × t', c:true}],
            calculo: {id:'x', label:'x', val:10, u:'m'}
        },
        {
            tipo: 'semi', titulo: "Ejercicio 3 (Semiparabólico: Altura de caída)",
            enunciado: "Un helicóptero deja caer un bulto. Si tarda 4 segundos en tocar el suelo, ¿a qué altura volaba el helicóptero? (g=10)",
            datos: [{id:'t', label:'t', val:4, u:'s'}, {id:'g', label:'g', val:10, u:'m/s²'}],
            formulaOptions: [{v:'correcta', t:'y = (g × t²) / 2', c:true}, {v:'incorrecta', t:'y = g × t', c:false}],
            calculo: {id:'y', label:'y', val:80, u:'m'}
        },
        {
            tipo: 'semi', titulo: "Ejercicio 4 (Semiparabólico: Velocidad Vertical Final)",
            enunciado: "Un proyectil se lanza horizontalmente y tarda 3 segundos en caer al piso. ¿Cuál es su velocidad vertical (Vy) justo antes de tocar el suelo? (g=10)",
            datos: [{id:'g', label:'g', val:10, u:'m/s²'}, {id:'t', label:'t', val:3, u:'s'}],
            formulaOptions: [{v:'incorrecta', t:'Vy = (g × t) / 2', c:false}, {v:'correcta', t:'Vy = g × t', c:true}],
            calculo: {id:'Vy', label:'Vy', val:30, u:'m/s'}
        },
        {
            tipo: 'semi', titulo: "Ejercicio 5 (Semiparabólico: Alcance X)",
            enunciado: "Un carro cae horizontalmente por un barranco con Vox = 10 m/s. Si tarda 3 s en caer (t=3). ¿A qué distancia de la base cae?",
            datos: [{id:'Vox', label:'Vox', val:10, u:'m/s'}, {id:'t', label:'t', val:3, u:'s'}],
            formulaOptions: [{v:'correcta', t:'x = Vox × t', c:true}, {v:'incorrecta', t:'x = Vox + t', c:false}],
            calculo: {id:'x', label:'x', val:30, u:'m'}
        },
        // PARABÓLICO COMPLETO (6 al 10)
        {
            tipo: 'para', titulo: "Ejercicio 6 (Parabólico: Componente Vertical Inicial)",
            enunciado: "Un balón es pateado con una velocidad inicial de 20 m/s y un ángulo cuyo seno es 0.5. ¿Cuál es la componente vertical (Voy)?",
            datos: [{id:'Vo', label:'Vo', val:20, u:'m/s'}, {id:'sen', label:'sen(?)', val:0.5, u:''}],
            formulaOptions: [{v:'incorrecta', t:'Voy = Vo × cos(?)', c:false}, {v:'correcta', t:'Voy = Vo × sen(?)', c:true}],
            calculo: {id:'Voy', label:'Voy', val:10, u:'m/s'}
        },
        {
            tipo: 'para', titulo: "Ejercicio 7 (Parabólico: Tiempo de vuelo)",
            enunciado: "Si la componente vertical Voy de un proyectil es 30 m/s. ¿Cuánto es su tiempo total de vuelo (tv)? (Usa g = 10 m/s²).",
            datos: [{id:'Voy', label:'Voy', val:30, u:'m/s'}, {id:'g', label:'g', val:10, u:'m/s²'}],
            formulaOptions: [{v:'correcta', t:'tv = (2 × Voy) / g', c:true}, {v:'incorrecta', t:'tv = Voy / (2 × g)', c:false}],
            calculo: {id:'tv', label:'tv', val:6, u:'s'} // 2*30/10 = 6
        },
        {
            tipo: 'para', titulo: "Ejercicio 8 (Parabólico: Altura Máxima)",
            enunciado: "Un proyectil tiene una componente vertical Voy de 20 m/s. Calcula su altura máxima alcanzada (H). (g = 10)",
            datos: [{id:'Voy', label:'Voy', val:20, u:'m/s'}, {id:'g', label:'g', val:10, u:'m/s²'}],
            formulaOptions: [{v:'incorrecta', t:'H = Voy² / g', c:false}, {v:'correcta', t:'H = Voy² / (2 × g)', c:true}],
            calculo: {id:'H', label:'H', val:20, u:'m'} // 400/20 = 20
        },
        {
            tipo: 'para', titulo: "Ejercicio 9 (Parabólico: Componente Horizontal)",
            enunciado: "Un cañón dispara con Vo = 50 m/s. El coseno del ángulo de disparo es 0.6. ¿Cuál es su componente horizontal (Vox)?",
            datos: [{id:'Vo', label:'Vo', val:50, u:'m/s'}, {id:'cos', label:'cos(?)', val:0.6, u:''}],
            formulaOptions: [{v:'correcta', t:'Vox = Vo × cos(?)', c:true}, {v:'incorrecta', t:'Vox = Vo × sen(?)', c:false}],
            calculo: {id:'Vox', label:'Vox', val:30, u:'m/s'}
        },
        {
            tipo: 'para', titulo: "Ejercicio 10 (Parabólico: Alcance Máximo)",
            enunciado: "Si Vox de un proyectil es 30 m/s y dura volando un total de 8 segundos (tv). ¿Cuál es su alcance horizontal máximo (Xmax)?",
            datos: [{id:'Vox', label:'Vox', val:30, u:'m/s'}, {id:'tv', label:'tv', val:8, u:'s'}],
            formulaOptions: [{v:'correcta', t:'Xmax = Vox × tv', c:true}, {v:'incorrecta', t:'Xmax = Vox² / g', c:false}],
            calculo: {id:'Xmax', label:'Xmax', val:240, u:'m'}
        }
    ];

    let ejerciciosFinalizados = 0;
    const totalEjercicios = 10;
    let completados = Array(10).fill(false);

    function generarHTML() {
        const contenedor = document.getElementById('ejercicios-container');
        let html = '';
        
        ejerciciosData.forEach((ej, idx) => {
            const num = idx + 1;
            
            let datosHtml = '';
            ej.datos.forEach(d => {
                datosHtml += `<div class="input-grupo"><label>${d.label}</label><input type="number" id="ej${num}-${d.id}" placeholder="${d.val}"><div class="unidad">${d.u}</div></div>`;
            });

            let opcionesFormula = `<option value="">— Selecciona —</option>`;
            ej.formulaOptions.forEach(opt => {
                opcionesFormula += `<option value="${opt.c ? 'correcta' : 'incorrecta'}">${opt.t}</option>`;
            });

            html += `
            <div class="ejercicio-box ${ej.tipo}" id="ej${num}">
                <h3><i class="fas fa-rocket"></i> ${ej.titulo}</h3>
                <div class="enunciado">${ej.enunciado}</div>
                
                <div class="paso-contenedor activo" id="ej${num}-p1">
                    <div class="paso-titulo">?? Paso 1: Extraer Datos <span class="icono-check">?</span></div>
                    <div class="grid-datos">${datosHtml}</div>
                    <button class="btn-validar" onclick="validarPaso(${num}, 'p1')">Validar Datos</button>
                    <div class="feedback" id="ej${num}-p1-fb"></div>
                </div>

                <div class="paso-contenedor oculto" id="ej${num}-p2">
                    <div class="paso-titulo">?? Paso 2: Elegir Fórmula <span class="icono-check">?</span></div>
                    <select id="ej${num}-formula">${opcionesFormula}</select>
                    <button class="btn-validar" onclick="validarPaso(${num}, 'p2')">Validar Fórmula</button>
                    <div class="feedback" id="ej${num}-p2-fb"></div>
                </div>

                <div class="paso-contenedor oculto" id="ej${num}-p3">
                    <div class="paso-titulo">?? Paso 3: Calcular <span class="icono-check">?</span></div>
                    <div class="input-grupo" style="max-width:200px;">
                        <label>${ej.calculo.label}</label>
                        <input type="number" id="ej${num}-res" placeholder="?">
                        <div class="unidad">${ej.calculo.u}</div>
                    </div>
                    <button class="btn-validar" onclick="validarPaso(${num}, 'p3')">Validar Cálculo</button>
                    <div class="feedback" id="ej${num}-p3-fb"></div>
                </div>
            </div>`;
        });
        contenedor.innerHTML = html;
    }

    function cerca(val, esperado, tol=0.02) {
        return Math.abs(val - esperado) <= Math.abs(esperado * tol) + 0.05;
    }

    const MSJS_OK = ['¡Excelente!', '¡Correcto!', '¡Perfecto!', '¡Muy bien!'];
    const MSJS_MAL = ['Incorrecto. Revisa tus datos.', 'Vuelve a intentarlo.', 'Revisa bien la fórmula o cálculo.'];

    window.validarPaso = function(num, paso) {
        const ej = ejerciciosData[num-1];
        let valido = true;

        if (paso === 'p1') {
            ej.datos.forEach(d => {
                const inputVal = parseFloat(document.getElementById(`ej${num}-${d.id}`).value);
                if (!cerca(inputVal, d.val)) valido = false;
            });
        } else if (paso === 'p2') {
            const sel = document.getElementById(`ej${num}-formula`).value;
            valido = (sel === 'correcta');
        } else if (paso === 'p3') {
            const res = parseFloat(document.getElementById(`ej${num}-res`).value);
            valido = cerca(res, ej.calculo.val);
        }

        const fb = document.getElementById(`ej${num}-${paso}-fb`);
        const pasoEl = document.getElementById(`ej${num}-${paso}`);

        if (valido) {
            fb.className = 'feedback correcto';
            fb.textContent = MSJS_OK[Math.floor(Math.random() * MSJS_OK.length)];
            pasoEl.classList.add('completado');
            pasoEl.classList.remove('activo');

            if (paso === 'p1') {
                const p2 = document.getElementById(`ej${num}-p2`);
                p2.classList.remove('oculto'); p2.classList.add('activo');
            } else if (paso === 'p2') {
                const p3 = document.getElementById(`ej${num}-p3`);
                p3.classList.remove('oculto'); p3.classList.add('activo');
            } else if (paso === 'p3') {
                if (!completados[num-1]) {
                    completados[num-1] = true;
                    ejerciciosFinalizados++;
                    document.getElementById('barra-fill').style.width = Math.round((ejerciciosFinalizados / totalEjercicios) * 100) + '%';
                    document.getElementById('texto-progreso').textContent = `${ejerciciosFinalizados} / ${totalEjercicios} ejercicios completados`;
                }
            }
        } else {
            fb.className = 'feedback incorrecto';
            fb.textContent = MSJS_MAL[Math.floor(Math.random() * MSJS_MAL.length)];
        }
    };

    generarHTML();
</script>
<script src="auth.js"></script>
</body>
</html>
