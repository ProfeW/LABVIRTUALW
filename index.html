<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LabVirtual W</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --color-fisica: #3498db;   
            --color-quimica: #9b59b6;  
            --color-biologia: #2ecc71; 
            --color-oscuro: #1a1a2e;
            --color-texto: #ffffff;
        }

        html {
            scroll-behavior: smooth;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--color-oscuro);
            color: var(--color-texto);
            background-image: linear-gradient(rgba(26, 26, 46, 0.85), rgba(26, 26, 46, 0.95)), url('https://images.unsplash.com/photo-1532094349884-543bc11b234d?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            min-height: 100vh;
        }

        /* --- BARRA DE NAVEGACIÓN --- */
        nav {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px); 
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 50px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .logo i {
            color: var(--color-fisica);
        }

        .menu {
            list-style: none;
            display: flex;
            gap: 20px;
        }

        .menu > li {
            position: relative;
        }

        .menu a {
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            padding: 10px 15px;
            border-radius: 5px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .menu > li > a:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #4facfe;
        }

        /* --- SUBMENÚS --- */
        .submenu {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background: rgba(20, 20, 35, 0.95);
            backdrop-filter: blur(15px);
            min-width: 180px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        .menu li:hover .submenu {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .submenu li {
            list-style: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .submenu a {
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 400;
        }

        .submenu a:hover {
            background: rgba(255, 255, 255, 0.1);
            padding-left: 25px; 
        }

        .fisica:hover { border-left: 4px solid var(--color-fisica); }
        .quimica:hover { border-left: 4px solid var(--color-quimica); }
        .biologia:hover { border-left: 4px solid var(--color-biologia); }

        /* --- CONTENEDOR PRINCIPAL PARA EL CONTENIDO --- */
        .contenedor {
            max-width: 1200px;
            margin: 50px auto;
            padding: 20px;
            animation: fadeIn 0.5s ease;
        }

        /* Mantengo las clases base que usaremos en las demás páginas para que no se pierdan */
        .bienvenida { text-align: center; margin-bottom: 60px; }
        .bienvenida h1 { font-size: 3rem; margin-bottom: 15px; background: linear-gradient(to right, #4facfe 0%, #00f2fe 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .seccion-noticias { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 15px; padding: 30px; backdrop-filter: blur(5px); }
        .seccion-noticias h2 { margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .grid-noticias { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .tarjeta { background: rgba(0, 0, 0, 0.4); padding: 20px; border-radius: 10px; border-left: 4px solid #4facfe; transition: transform 0.3s ease; }
        .tarjeta:hover { transform: translateY(-5px); }
        
        .titulo-seccion { border-left: 5px solid var(--color-fisica); padding-left: 15px; margin: 40px 0 20px 0; font-size: 24px; color: #4facfe; }
        .lista-temas { display: flex; flex-direction: column; gap: 15px; }
        .entrada-tema { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 20px; display: flex; align-items: center; gap: 25px; transition: 0.3s; cursor: pointer; text-decoration: none; color: white; }
        .entrada-tema:hover { background: rgba(79, 172, 254, 0.1); transform: translateX(10px); border-color: var(--color-fisica); }
        .numero-tema { font-size: 32px; font-weight: 800; color: rgba(255,255,255,0.1); min-width: 50px; text-align: center; }
        .info-tema h3 { font-size: 18px; margin-bottom: 5px; color: #fff; }
        .info-tema p { font-size: 14px; color: #bbb; line-height: 1.4; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
