        .logo i { color: var(--color-quimica); }

        .contenedor { max-width: 960px; margin: 40px auto; padding: 20px; }

        .btn-volver:hover { color: #fff; transform: translateX(-5px); }
        .encabezado-leccion { border-bottom: 2px solid rgba(231,76,60,0.4); padding-bottom: 20px; margin-bottom: 30px; text-align: center; }

        .barra-progreso-titulo { font-weight: 700; color: #fff; margin-bottom: 10px; display: flex; justify-content: space-between; }
        .barra { background: rgba(255,255,255,0.1); border-radius: 20px; height: 10px; overflow: hidden; }

        .ejercicio-box { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 30px; margin-bottom: 50px; border-top: 4px solid var(--color-secundario); }

        .paso-contenedor { background: rgba(0,0,0,0.4); padding: 25px; border-radius: 8px; margin-bottom: 12px; border-left: 3px solid #444; transition: 0.3s; }
        .paso-contenedor.activo { border-left-color: var(--color-secundario); box-shadow: 0 5px 15px rgba(231,76,60,0.1); }
        .paso-contenedor.completado { border-left-color: var(--color-exito); opacity: 0.7; pointer-events: none; }
        .paso-titulo { font-weight: 800; color: #fff; font-size: 1.1rem; text-transform: uppercase; margin-bottom: 12px; display: flex; justify-content: space-between; }
        .icono-check { color: var(--color-exito); display: none; font-size: 1.4rem; }
        .completado .icono-check { display: block; }

        .grid-datos { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 15px; }
        .input-grupo { display: flex; align-items: stretch; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; overflow: hidden; }
        .input-grupo label { background: rgba(0,0,0,0.5); padding: 10px; color: #fff; font-weight: bold; min-width: 60px; text-align: center; border-right: 1px solid rgba(255,255,255,0.1); }
        .input-grupo input { flex: 1; padding: 10px; border: none; background: transparent; color: #fff; font-size: 1.05rem; text-align: center; outline: none; width: 100%; }
        .input-grupo .unidad { background: rgba(231,76,60,0.15); padding: 10px; font-size: 0.85rem; color: #fff; border-left: 1px solid rgba(255,255,255,0.1); }
        select { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); background: rgba(20,20,35,0.8); color: #fff; font-size: 1rem; margin-bottom: 15px; outline: none; }

        .btn-validar { background: var(--color-secundario); color: #fff; border: none; padding: 12px 28px; border-radius: 6px; font-weight: 700; cursor: pointer; transition: 0.3s; font-size: 1rem; }
        .btn-validar:hover { opacity: 0.85; transform: translateY(-2px); }

        .feedback { display: none; margin-top: 12px; padding: 10px 15px; border-radius: 6px; font-weight: 600; }
        .feedback.correcto { display: block; background: rgba(46,204,113,0.15); border: 1px solid var(--color-exito); color: var(--color-exito); }
        .feedback.incorrecto { display: block; background: rgba(231,76,60,0.15); border: 1px solid var(--color-error); color: var(--color-error); }
    </style>
</head>
<body>
    <nav>

    <div class="contenedor">
        <a href="quimica9_masa_masa.html" class="btn-volver"><i class="fa-solid fa-arrow-left"></i> Volver a TeorÃ­a</a>
        
        <div class="encabezado-leccion">
            <h1>ðŸŽ® PrÃ¡ctica Interactiva: % m/m</h1>
            <p>10 Ejercicios paso a paso para dominar el Porcentaje Masa a Masa</p>
        </div>

        <div class="barra-progreso-contenedor">
            <div class="barra-progreso-titulo">
                <span>ðŸ“Š Progreso General</span>
                <span id="texto-progreso">0 / 10 ejercicios completados</span>
            </div>
            <div class="barra"><div class="barra-fill" id="barra-fill"></div></div>

    <script>
        const ejercicios = [
            {
                titulo: "Ejercicio 1: Directo separando soluto y solvente",
                enunciado: "Se disuelven 15 g de cloruro de sodio (sal) en 85 g de agua. Â¿CuÃ¡l es el % m/m de la soluciÃ³n?",
                pasos: [
                    { tipo: 'datos', inputs: ['m_soluto', 'm_solvente'], valores: [15, 85], labels: ['m. Soluto', 'm. Solvente'], unidades: ['g', 'g'] },
                    { tipo: 'calculo', label: 'm. SoluciÃ³n', valor: 100, formula: "Suma soluto + solvente para hallar la masa de la soluciÃ³n", unidad: 'g' },
                    { tipo: 'formula', seleccion: '%m/m' },
                    { tipo: 'calculo', label: '% m/m', valor: 15, formula: "Aplica la fÃ³rmula: (m. Soluto / m. SoluciÃ³n) Ã— 100", unidad: '%' }
                ]
            },
            {
                titulo: "Ejercicio 2: Calculando % con masa de soluciÃ³n dada",
                enunciado: "Tenemos una soluciÃ³n acuosa de 200 g que contiene 40 g de azÃºcar. Calcula su % m/m.",
                pasos: [
                    { tipo: 'datos', inputs: ['m_soluto', 'm_solucion'], valores: [40, 200], labels: ['m. Soluto', 'm. SoluciÃ³n'], unidades: ['g', 'g'], extra: "Nota que ya te dan el total de la soluciÃ³n." },
                    { tipo: 'formula', seleccion: '%m/m' },
                    { tipo: 'calculo', label: '% m/m', valor: 20, formula: "Aplica: (40 / 200) Ã— 100", unidad: '%' }
                ]
            },
            {
                titulo: "Ejercicio 3: Otro bÃ¡sico",
                enunciado: "Si preparas un jugo con 25 g de polvo para jugo y 475 g de agua, Â¿cuÃ¡l es el porcentaje masa a masa?",
                pasos: [
                    { tipo: 'datos', inputs: ['m_soluto', 'm_solvente'], valores: [25, 475], labels: ['m. Soluto', 'm. Solvente'], unidades: ['g', 'g'] },
                    { tipo: 'calculo', label: 'm. SoluciÃ³n', valor: 500, formula: "Calcula la masa total de la soluciÃ³n", unidad: 'g' },
                    { tipo: 'calculo', label: '% m/m', valor: 5, formula: "Aplica la fÃ³rmula de % m/m", unidad: '%' }
                ]
            },
            {
                titulo: "Ejercicio 4: Hallando la masa del Soluto",
                enunciado: "Â¿CuÃ¡ntos gramos de hidrÃ³xido de sodio (NaOH) hay en 300 g de una soluciÃ³n al 15% m/m?",
                pasos: [
                    { tipo: 'datos', inputs: ['m_solucion', 'porcentaje'], valores: [300, 15], labels: ['m. SoluciÃ³n', '% m/m'], unidades: ['g', '%'] },
                    { tipo: 'formula', seleccion: 'soluto' },
                    { tipo: 'calculo', label: 'm. Soluto', valor: 45, formula: "Aplica el despeje: (15 Ã— 300) / 100", unidad: 'g' }
                ]
            },
            {
                titulo: "Ejercicio 5: Hallando masa del Soluto",
                enunciado: "Una crema hidratante de 120 g tiene vitamina E al 2% m/m. Â¿CuÃ¡ntos gramos de vitamina E contiene?",
                pasos: [
                    { tipo: 'datos', inputs: ['m_solucion', 'porcentaje'], valores: [120, 2], labels: ['m. SoluciÃ³n', '% m/m'], unidades: ['g', '%'] },
                    { tipo: 'calculo', label: 'm. Soluto', valor: 2.4, formula: "Usa la fÃ³rmula para soluto", unidad: 'g' }
                ]
            },
            {
                titulo: "Ejercicio 6: Hallando la masa de la SoluciÃ³n",
                enunciado: "Se sabe que una soluciÃ³n al 20% m/m contiene 60 g de soluto. Â¿CuÃ¡l es la masa total de la soluciÃ³n?",
                pasos: [
                    { tipo: 'datos', inputs: ['m_soluto', 'porcentaje'], valores: [60, 20], labels: ['m. Soluto', '% m/m'], unidades: ['g', '%'] },
                    { tipo: 'formula', seleccion: 'solucion' },
                    { tipo: 'calculo', label: 'm. SoluciÃ³n', valor: 300, formula: "Aplica el despeje: (60 Ã— 100) / 20", unidad: 'g' }
                ]
            },
            {
                titulo: "Ejercicio 7: Hallando masa de SoluciÃ³n",
                enunciado: "Para un experimento necesitas 5 g de un reactivo. Si el frasco dice 'SoluciÃ³n al 10% m/m', Â¿cuÃ¡ntos gramos de soluciÃ³n debes pesar?",
                pasos: [
                    { tipo: 'datos', inputs: ['m_soluto', 'porcentaje'], valores: [5, 10], labels: ['m. Soluto', '% m/m'], unidades: ['g', '%'] },
                    { tipo: 'calculo', label: 'm. SoluciÃ³n', valor: 50, formula: "Usa la fÃ³rmula para soluciÃ³n", unidad: 'g' }
                ]
            },
            {
                titulo: "Ejercicio 8: Hallando masa de Solvente (Reto)",
                enunciado: "Quieres preparar 250 g de soluciÃ³n al 8% m/m. Â¿CuÃ¡ntos gramos de solvente (agua) necesitas?",
                pasos: [
                    { tipo: 'datos', inputs: ['m_solucion', 'porcentaje'], valores: [250, 8], labels: ['m. SoluciÃ³n', '% m/m'], unidades: ['g', '%'] },
                    { tipo: 'calculo', label: 'm. Soluto', valor: 20, formula: "Primero, calcula la masa del soluto", unidad: 'g' },
                    { tipo: 'calculo', label: 'm. Solvente', valor: 230, formula: "Como SoluciÃ³n = Soluto + Solvente, entonces Solvente = SoluciÃ³n - Soluto", unidad: 'g' }
                ]
            },
            {
                titulo: "Ejercicio 9: Otro de Solvente",
                enunciado: "Si tienes 500 g de soluciÃ³n al 12% m/m de Ã¡cido nÃ­trico, Â¿cuÃ¡nta masa es exclusivamente agua (solvente)?",
                pasos: [
                    { tipo: 'datos', inputs: ['m_solucion', 'porcentaje'], valores: [500, 12], labels: ['m. SoluciÃ³n', '% m/m'], unidades: ['g', '%'] },
                    { tipo: 'calculo', label: 'm. Soluto', valor: 60, formula: "Calcula soluto primero", unidad: 'g' },
                    { tipo: 'calculo', label: 'm. Solvente', valor: 440, formula: "Resta el soluto a la soluciÃ³n", unidad: 'g' }
                ]
            },
            {
                titulo: "Ejercicio 10: DesafÃ­o Final",
                enunciado: "Si disuelves 40 g de cloruro de potasio (KCl) en 160 g de agua, Â¿quÃ© porcentaje de la mezcla representa el solvente (agua)? (Pista: es 100% - %m/m, o (solvente/solucion)*100)",
                pasos: [
                    { tipo: 'datos', inputs: ['m_soluto', 'm_solvente'], valores: [40, 160], labels: ['m. Soluto', 'm. Solvente'], unidades: ['g', 'g'] },
                    { tipo: 'calculo', label: 'm. SoluciÃ³n', valor: 200, formula: "Suma para obtener soluciÃ³n", unidad: 'g' },
                    { tipo: 'calculo', label: '% m/m (soluto)', valor: 20, formula: "Calcula el % m/m normal (del soluto)", unidad: '%' },
                    { tipo: 'calculo', label: '% m/m (solvente)', valor: 80, formula: "El resto hasta el 100% es el solvente", unidad: '%' }
                ]
            }
        ];

        const formulasHTML = `
            <select class="select-formula">
                <option value="">-- Selecciona la fÃ³rmula correcta --</option>
                <option value="%m/m">% m/m = (m. Soluto / m. SoluciÃ³n) Ã— 100</option>
                <option value="soluto">m. Soluto = (% m/m Ã— m. SoluciÃ³n) / 100</option>
                <option value="solucion">m. SoluciÃ³n = (m. Soluto Ã— 100) / % m/m</option>
            </select>
        `;

        const contenedor = document.getElementById('contenedor-ejercicios');
        let completados = 0;

        function generarHTML() {
            ejercicios.forEach((ej, index) => {
                let html = `<div class="ejercicio-box" id="ej${index}">`;
                html += `<h3><i class="fa-solid fa-flask"></i> ${ej.titulo}</h3>`;
                html += `<div class="enunciado">${ej.enunciado}</div>`;
                
                ej.pasos.forEach((paso, pIndex) => {
                    const activo = pIndex === 0 ? 'activo' : 'oculto';
                    html += `<div class="paso-contenedor ${activo}" id="ej${index}-p${pIndex}">`;
                    
                    if (paso.tipo === 'datos') {
                        html += `<div class="paso-titulo">ðŸ“‹ Identificar Datos <span class="icono-check">âœ”</span></div>`;
                        if(paso.extra) html += `<p style="color:#bbb; font-size:0.9rem; margin-bottom:10px;">${paso.extra}</p>`;
                        html += `<div class="grid-datos">`;
                        paso.inputs.forEach((input, i) => {
                            html += `<div class="input-grupo">
                                <label>${paso.labels[i]}</label>
                                <input type="number" id="input-${index}-${pIndex}-${i}" placeholder="?">
                                <div class="unidad">${paso.unidades[i]}</div>
                            </div>`;
                        });
                        html += `</div>`;
                    } else if (paso.tipo === 'formula') {
                        html += `<div class="paso-titulo">ðŸ“ Seleccionar FÃ³rmula <span class="icono-check">âœ”</span></div>`;
                        html += formulasHTML.replace('class="select-formula"', `id="input-${index}-${pIndex}-0"`);
                    } else if (paso.tipo === 'calculo') {
                        html += `<div class="paso-titulo">ðŸ”¢ Calcular <span class="icono-check">âœ”</span></div>`;
                        html += `<p style="color:#bbb; font-size:0.9rem; margin-bottom:10px;">${paso.formula}</p>`;
                        html += `<div class="input-grupo" style="max-width:250px;">
                            <label>${paso.label}</label>
                            <input type="number" step="0.1" id="input-${index}-${pIndex}-0" placeholder="?">
                            <div class="unidad">${paso.unidad}</div>
                        </div>`;
                    }
                    
                    html += `<button class="btn-validar" onclick="validar(${index}, ${pIndex})"><i class="fas fa-check"></i> Validar</button>`;
                    html += `<div class="feedback" id="fb-${index}-${pIndex}"></div>`;
                    html += `</div>`;
                });
                
                html += `</div>`;
                contenedor.innerHTML += html;
            });
        }

        function cerca(val, esp) { return Math.abs(val - esp) <= Math.abs(esp * 0.05) + 0.05; }

        window.validar = function(ejIdx, pasoIdx) {
            const paso = ejercicios[ejIdx].pasos[pasoIdx];
            let valido = true;
            
            if (paso.tipo === 'datos') {
                paso.valores.forEach((val, i) => {
                    if (!cerca(parseFloat(document.getElementById(`input-${ejIdx}-${pasoIdx}-${i}`).value), val)) valido = false;
                });
            } else if (paso.tipo === 'formula') {
                if (document.getElementById(`input-${ejIdx}-${pasoIdx}-0`).value !== paso.seleccion) valido = false;
            } else if (paso.tipo === 'calculo') {
                if (!cerca(parseFloat(document.getElementById(`input-${ejIdx}-${pasoIdx}-0`).value), paso.valor)) valido = false;
            }

            const fb = document.getElementById(`fb-${ejIdx}-${pasoIdx}`);
            const pasoEl = document.getElementById(`ej${ejIdx}-p${pasoIdx}`);

            if (valido) {
                fb.className = 'feedback correcto';
                fb.textContent = 'Â¡Correcto! âœ”ï¸';
                pasoEl.classList.remove('activo');
                pasoEl.classList.add('completado');

                const sigPaso = document.getElementById(`ej${ejIdx}-p${pasoIdx + 1}`);
                if (sigPaso) {
                    sigPaso.classList.remove('oculto');
                    sigPaso.classList.add('activo');
                } else {
                    completados++;
                    document.getElementById('texto-progreso').textContent = `${completados} / 10 ejercicios completados`;
                    document.getElementById('barra-fill').style.width = (completados * 10) + '%';
                }
            } else {
                fb.className = 'feedback incorrecto';
                fb.textContent = 'Incorrecto. Revisa tus cÃ¡lculos y vuelve a intentar. âŒ';
            }
        };

        generarHTML();
    </script>
