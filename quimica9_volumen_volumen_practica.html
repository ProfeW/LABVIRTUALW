        nav { background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: center; padding: 15px 50px; position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 24px; font-weight: 800; color: #fff; display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .logo i { color: var(--color-quimica); }
        .menu { list-style: none; display: flex; gap: 20px; }
        .menu a { color: #fff; text-decoration: none; font-weight: 600; padding: 10px 15px; border-radius: 5px; transition: 0.3s; display: flex; align-items: center; gap: 8px; }
        .menu a:hover { background: rgba(255,255,255,0.1); color: var(--color-quimica); }
        
        .contenedor { max-width: 960px; margin: 40px auto; padding: 20px; }
        .btn-volver { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 20px; color: var(--color-quimica); text-decoration: none; font-weight: 600; transition: 0.3s; }
        .btn-volver:hover { color: #fff; transform: translateX(-5px); }
        .encabezado-leccion { border-bottom: 2px solid rgba(52,152,219,0.4); padding-bottom: 20px; margin-bottom: 30px; text-align: center; }

        .barra-progreso-contenedor { background: rgba(255,255,255,0.05); border-radius: 10px; padding: 20px; margin-bottom: 30px; border: 1px solid rgba(255,255,255,0.08); }
        .barra-progreso-titulo { font-weight: 700; color: #fff; margin-bottom: 10px; display: flex; justify-content: space-between; }
        .barra { background: rgba(255,255,255,0.1); border-radius: 20px; height: 10px; overflow: hidden; }
        .barra-fill { background: linear-gradient(90deg, var(--color-secundario), var(--color-quimica)); height: 100%; border-radius: 20px; transition: width 0.5s ease; width: 0%; }

        .ejercicio-box { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 30px; margin-bottom: 50px; border-top: 4px solid var(--color-secundario); }
        .ejercicio-box h3 { color: var(--color-secundario); margin-bottom: 10px; font-size: 1.5rem; display: flex; align-items: center; gap: 10px; }
        .enunciado { font-style: italic; color: #ddd; background: rgba(0,0,0,0.3); padding: 15px; border-radius: 8px; margin-bottom: 20px; font-size: 1.05rem; border-left: 4px solid #f39c12; }

        .paso-contenedor { background: rgba(0,0,0,0.4); padding: 25px; border-radius: 8px; margin-bottom: 12px; border-left: 3px solid #444; transition: 0.3s; }
        .paso-contenedor.activo { border-left-color: var(--color-secundario); box-shadow: 0 5px 15px rgba(52,152,219,0.1); }
        .paso-contenedor.completado { border-left-color: var(--color-exito); opacity: 0.7; pointer-events: none; }
        .paso-titulo { font-weight: 800; color: #fff; font-size: 1.1rem; text-transform: uppercase; margin-bottom: 12px; display: flex; justify-content: space-between; }
        .icono-check { color: var(--color-exito); display: none; font-size: 1.4rem; }
        .completado .icono-check { display: block; }
        .oculto { display: none; }

        .grid-datos { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 15px; }
        .input-grupo { display: flex; align-items: stretch; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; overflow: hidden; }
        .input-grupo label { background: rgba(0,0,0,0.5); padding: 10px; color: #fff; font-weight: bold; min-width: 60px; text-align: center; border-right: 1px solid rgba(255,255,255,0.1); }
        .input-grupo input { flex: 1; padding: 10px; border: none; background: transparent; color: #fff; font-size: 1.05rem; text-align: center; outline: none; width: 100%; }
        .input-grupo .unidad { background: rgba(52,152,219,0.15); padding: 10px; font-size: 0.85rem; color: #fff; border-left: 1px solid rgba(255,255,255,0.1); }
        select { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); background: rgba(20,20,35,0.8); color: #fff; font-size: 1rem; margin-bottom: 15px; outline: none; }

        .btn-validar { background: var(--color-secundario); color: #fff; border: none; padding: 12px 28px; border-radius: 6px; font-weight: 700; cursor: pointer; transition: 0.3s; font-size: 1rem; }
        .btn-validar:hover { opacity: 0.85; transform: translateY(-2px); }

        .feedback { display: none; margin-top: 12px; padding: 10px 15px; border-radius: 6px; font-weight: 600; }
        .feedback.correcto { display: block; background: rgba(46,204,113,0.15); border: 1px solid var(--color-exito); color: var(--color-exito); }
        .feedback.incorrecto { display: block; background: rgba(231,76,60,0.15); border: 1px solid var(--color-error); color: var(--color-error); }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="logo"><i class="fa-solid fa-microscope"></i> LabVirtual W</a>
        <ul class="menu">

    </nav>

    <div class="contenedor">
        <a href="quimica9_volumen_volumen.html" class="btn-volver"><i class="fa-solid fa-arrow-left"></i> Volver a TeorÃ­a</a>
        
        <div class="encabezado-leccion">
            <h1>ðŸŽ® PrÃ¡ctica Interactiva: % v/v</h1>
            <p>10 Ejercicios paso a paso para dominar el Porcentaje Volumen a Volumen</p>
        </div>

        <div class="barra-progreso-contenedor">
            <div class="barra-progreso-titulo">
                <span>ðŸ“Š Progreso General</span>
                <span id="texto-progreso">0 / 10 ejercicios completados</span>
            </div>
            <div class="barra"><div class="barra-fill" id="barra-fill"></div></div>

    <script>
        const ejercicios = [
            {
                titulo: "Ejercicio 1: Calculando porcentaje",
                enunciado: "Se mezclan 25 mL de alcohol con 75 mL de agua destilada. Calcula el % v/v de la soluciÃ³n resultante.",
                pasos: [
                    { tipo: 'datos', inputs: ['v_soluto', 'v_solvente'], valores: [25, 75], labels: ['v. Soluto', 'v. Solvente'], unidades: ['mL', 'mL'] },
                    { tipo: 'calculo', label: 'v. SoluciÃ³n', valor: 100, formula: "Suma soluto + solvente para hallar el volumen de la soluciÃ³n", unidad: 'mL' },
                    { tipo: 'formula', seleccion: '%v/v' },
                    { tipo: 'calculo', label: '% v/v', valor: 25, formula: "Aplica la fÃ³rmula: (v. Soluto / v. SoluciÃ³n) Ã— 100", unidad: '%' }
                ]
            },
            {
                titulo: "Ejercicio 2: SoluciÃ³n total dada",
                enunciado: "En un recipiente hay 300 mL de una soluciÃ³n que contiene 15 mL de esencia. Â¿CuÃ¡l es su concentraciÃ³n en volumen?",
                pasos: [
                    { tipo: 'datos', inputs: ['v_soluto', 'v_solucion'], valores: [15, 300], labels: ['v. Soluto', 'v. SoluciÃ³n'], unidades: ['mL', 'mL'], extra: "Ojo: ya tienes el total de la soluciÃ³n." },
                    { tipo: 'formula', seleccion: '%v/v' },
                    { tipo: 'calculo', label: '% v/v', valor: 5, formula: "Aplica: (15 / 300) Ã— 100", unidad: '%' }
                ]
            },
            {
                titulo: "Ejercicio 3: Mezcla de lÃ­quidos",
                enunciado: "Se preparan 450 mL de soluciÃ³n al mezclar 90 mL de acetona con agua. Calcula el % v/v.",
                pasos: [
                    { tipo: 'datos', inputs: ['v_soluto', 'v_solucion'], valores: [90, 450], labels: ['v. Soluto', 'v. SoluciÃ³n'], unidades: ['mL', 'mL'] },
                    { tipo: 'formula', seleccion: '%v/v' },
                    { tipo: 'calculo', label: '% v/v', valor: 20, formula: "Calcula el porcentaje de la acetona en la mezcla", unidad: '%' }
                ]
            },
            {
                titulo: "Ejercicio 4: Hallando el soluto",
                enunciado: "Â¿CuÃ¡ntos mililitros de Ã¡cido acÃ©tico puro hay en una botella de 600 mL de vinagre al 4% v/v?",
                pasos: [
                    { tipo: 'datos', inputs: ['v_solucion', 'porcentaje'], valores: [600, 4], labels: ['v. SoluciÃ³n', '% v/v'], unidades: ['mL', '%'] },
                    { tipo: 'formula', seleccion: 'soluto' },
                    { tipo: 'calculo', label: 'v. Soluto', valor: 24, formula: "Aplica el despeje: (4 Ã— 600) / 100", unidad: 'mL' }
                ]
            },
            {
                titulo: "Ejercicio 5: Otro de soluto",
                enunciado: "Una botella de vino de 750 mL tiene una concentraciÃ³n de 14% v/v de alcohol. Â¿QuÃ© volumen de alcohol ingerimos al beberla completa?",
                pasos: [
                    { tipo: 'datos', inputs: ['v_solucion', 'porcentaje'], valores: [750, 14], labels: ['v. SoluciÃ³n', '% v/v'], unidades: ['mL', '%'] },
                    { tipo: 'calculo', label: 'v. Soluto', valor: 105, formula: "Usa el despeje para soluto", unidad: 'mL' }
                ]
            },
            {
                titulo: "Ejercicio 6: Hallando la soluciÃ³n total",
                enunciado: "Si tenemos 40 mL de glicerina y queremos preparar una soluciÃ³n al 10% v/v, Â¿cuÃ¡l debe ser el volumen total de la soluciÃ³n?",
                pasos: [
                    { tipo: 'datos', inputs: ['v_soluto', 'porcentaje'], valores: [40, 10], labels: ['v. Soluto', '% v/v'], unidades: ['mL', '%'] },
                    { tipo: 'formula', seleccion: 'solucion' },
                    { tipo: 'calculo', label: 'v. SoluciÃ³n', valor: 400, formula: "Aplica el despeje: (40 Ã— 100) / 10", unidad: 'mL' }
                ]
            },
            {
                titulo: "Ejercicio 7: Hallando soluciÃ³n",
                enunciado: "Un desinfectante requiere 25 mL de amonio cuaternario para una concentraciÃ³n del 5% v/v. Â¿CuÃ¡nto desinfectante (soluciÃ³n total) se obtendrÃ¡?",
                pasos: [
                    { tipo: 'datos', inputs: ['v_soluto', 'porcentaje'], valores: [25, 5], labels: ['v. Soluto', '% v/v'], unidades: ['mL', '%'] },
                    { tipo: 'calculo', label: 'v. SoluciÃ³n', valor: 500, formula: "Usa el despeje de volumen de soluciÃ³n", unidad: 'mL' }
                ]
            },
            {
                titulo: "Ejercicio 8: Hallando el solvente (Reto)",
                enunciado: "Se necesita preparar 250 mL de alcohol al 70% v/v a partir de alcohol puro y agua. Â¿CuÃ¡ntos mL de agua (solvente) se usarÃ¡n?",
                pasos: [
                    { tipo: 'datos', inputs: ['v_solucion', 'porcentaje'], valores: [250, 70], labels: ['v. SoluciÃ³n', '% v/v'], unidades: ['mL', '%'] },
                    { tipo: 'calculo', label: 'v. Soluto', valor: 175, formula: "Primero, halla cuÃ¡nto alcohol puro se necesita", unidad: 'mL' },
                    { tipo: 'calculo', label: 'v. Solvente', valor: 75, formula: "Si la soluciÃ³n es 250 y el soluto es 175, resta para el agua", unidad: 'mL' }
                ]
            },
            {
                titulo: "Ejercicio 9: Otro cÃ¡lculo de solvente",
                enunciado: "Â¿QuÃ© volumen de solvente hay en 800 mL de una mezcla de anticongelante al 35% v/v?",
                pasos: [
                    { tipo: 'datos', inputs: ['v_solucion', 'porcentaje'], valores: [800, 35], labels: ['v. SoluciÃ³n', '% v/v'], unidades: ['mL', '%'] },
                    { tipo: 'calculo', label: 'v. Soluto', valor: 280, formula: "Halla los mL de soluto (anticongelante puro)", unidad: 'mL' },
                    { tipo: 'calculo', label: 'v. Solvente', valor: 520, formula: "Halla los mL de agua (solvente)", unidad: 'mL' }
                ]
            },
            {
                titulo: "Ejercicio 10: ConcentraciÃ³n del solvente",
                enunciado: "Si mezclas 60 mL de jugo concentrado con 240 mL de agua, Â¿quÃ© porcentaje de volumen representa el agua en esta mezcla?",
                pasos: [
                    { tipo: 'datos', inputs: ['v_soluto', 'v_solvente'], valores: [60, 240], labels: ['v. Soluto (jugo)', 'v. Solvente (agua)'], unidades: ['mL', 'mL'] },
                    { tipo: 'calculo', label: 'v. SoluciÃ³n', valor: 300, formula: "Suma los volÃºmenes", unidad: 'mL' },
                    { tipo: 'calculo', label: '% v/v (soluto)', valor: 20, formula: "Calcula la concentraciÃ³n del jugo", unidad: '%' },
                    { tipo: 'calculo', label: '% v/v (solvente)', valor: 80, formula: "Sabiendo que el total es 100%, halla la del agua", unidad: '%' }
                ]
            }
        ];

        const formulasHTML = `
            <select class="select-formula">
                <option value="">-- Selecciona la fÃ³rmula correcta --</option>
                <option value="%v/v">% v/v = (v. Soluto / v. SoluciÃ³n) Ã— 100</option>
                <option value="soluto">v. Soluto = (% v/v Ã— v. SoluciÃ³n) / 100</option>
                <option value="solucion">v. SoluciÃ³n = (v. Soluto Ã— 100) / % v/v</option>
            </select>
        `;

        const contenedor = document.getElementById('contenedor-ejercicios');
        let completados = 0;

        function generarHTML() {
            ejercicios.forEach((ej, index) => {
                let html = `<div class="ejercicio-box" id="ej${index}">`;
                html += `<h3><i class="fa-solid fa-droplet"></i> ${ej.titulo}</h3>`;
                html += `<div class="enunciado">${ej.enunciado}</div>`;
                
                ej.pasos.forEach((paso, pIndex) => {
                    const activo = pIndex === 0 ? 'activo' : 'oculto';
                    html += `<div class="paso-contenedor ${activo}" id="ej${index}-p${pIndex}">`;
                    
                    if (paso.tipo === 'datos') {
                        html += `<div class="paso-titulo">ðŸ“‹ Identificar Datos <span class="icono-check">âœ”</span></div>`;
                        if(paso.extra) html += `<p style="color:#bbb; font-size:0.9rem; margin-bottom:10px;">${paso.extra}</p>`;
                        html += `<div class="grid-datos">`;
                        paso.inputs.forEach((input, i) => {
                            html += `<div class="input-grupo">
                                <label>${paso.labels[i]}</label>
                                <input type="number" id="input-${index}-${pIndex}-${i}" placeholder="?">
                                <div class="unidad">${paso.unidades[i]}</div>
                            </div>`;
                        });
                        html += `</div>`;
                    } else if (paso.tipo === 'formula') {
                        html += `<div class="paso-titulo">ðŸ“ Seleccionar FÃ³rmula <span class="icono-check">âœ”</span></div>`;
                        html += formulasHTML.replace('class="select-formula"', `id="input-${index}-${pIndex}-0"`);
                    } else if (paso.tipo === 'calculo') {
                        html += `<div class="paso-titulo">ðŸ”¢ Calcular <span class="icono-check">âœ”</span></div>`;
                        html += `<p style="color:#bbb; font-size:0.9rem; margin-bottom:10px;">${paso.formula}</p>`;
                        html += `<div class="input-grupo" style="max-width:250px;">
                            <label>${paso.label}</label>
                            <input type="number" step="0.1" id="input-${index}-${pIndex}-0" placeholder="?">
                            <div class="unidad">${paso.unidad}</div>
                        </div>`;
                    }
                    
                    html += `<button class="btn-validar" onclick="validar(${index}, ${pIndex})"><i class="fas fa-check"></i> Validar</button>`;
                    html += `<div class="feedback" id="fb-${index}-${pIndex}"></div>`;
                    html += `</div>`;
                });
                
                html += `</div>`;
                contenedor.innerHTML += html;
            });
        }

        function cerca(val, esp) { return Math.abs(val - esp) <= Math.abs(esp * 0.05) + 0.05; }

        window.validar = function(ejIdx, pasoIdx) {
            const paso = ejercicios[ejIdx].pasos[pasoIdx];
            let valido = true;
            
            if (paso.tipo === 'datos') {
                paso.valores.forEach((val, i) => {
                    if (!cerca(parseFloat(document.getElementById(`input-${ejIdx}-${pasoIdx}-${i}`).value), val)) valido = false;
                });
            } else if (paso.tipo === 'formula') {
                if (document.getElementById(`input-${ejIdx}-${pasoIdx}-0`).value !== paso.seleccion) valido = false;
            } else if (paso.tipo === 'calculo') {
                if (!cerca(parseFloat(document.getElementById(`input-${ejIdx}-${pasoIdx}-0`).value), paso.valor)) valido = false;
            }

            const fb = document.getElementById(`fb-${ejIdx}-${pasoIdx}`);
            const pasoEl = document.getElementById(`ej${ejIdx}-p${pasoIdx}`);

            if (valido) {
                fb.className = 'feedback correcto';
                fb.textContent = 'Â¡Correcto! âœ”ï¸';
                pasoEl.classList.remove('activo');
                pasoEl.classList.add('completado');

                const sigPaso = document.getElementById(`ej${ejIdx}-p${pasoIdx + 1}`);
                if (sigPaso) {
                    sigPaso.classList.remove('oculto');
                    sigPaso.classList.add('activo');
                } else {
                    completados++;
                    document.getElementById('texto-progreso').textContent = `${completados} / 10 ejercicios completados`;
                    document.getElementById('barra-fill').style.width = (completados * 10) + '%';
                }
            } else {
                fb.className = 'feedback incorrecto';
                fb.textContent = 'Incorrecto. Revisa tus cÃ¡lculos. âŒ';
            }
        };

        generarHTML();
    </script>
