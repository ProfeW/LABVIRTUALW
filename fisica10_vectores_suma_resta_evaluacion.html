<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluación: Suma y Resta de Vectores - LabVirtual W</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        :root {
            --color-fisica: #3498db;   
            --color-oscuro: #1a1a2e;
            --color-texto: #ffffff;
            --color-error: #e74c3c;
            --color-exito: #2ecc71;
        }

        html { scroll-behavior: smooth; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--color-oscuro); color: var(--color-texto); }
        
        nav { background: rgba(255, 255, 255, 0.05); padding: 15px 50px; display: flex; justify-content: space-between; }
        .logo { font-size: 24px; font-weight: 800; color: #fff; text-decoration: none; }
        .logo i { color: var(--color-fisica); }

        .contenedor { max-width: 800px; margin: 40px auto; padding: 20px; }
        
        .evaluacion-container { background: rgba(255,255,255,0.05); padding: 40px; border-radius: 15px; border-top: 5px solid var(--color-error); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .evaluacion-container h1 { text-align: center; margin-bottom: 30px; color: var(--color-error); }

        .pregunta { margin-bottom: 25px; padding-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .pregunta h3 { font-size: 1.1rem; margin-bottom: 15px; color: #fff; }
        .opciones label { display: block; margin-bottom: 10px; padding: 12px; background: rgba(0,0,0,0.3); border-radius: 8px; cursor: pointer; transition: 0.3s; border: 1px solid transparent; }
        .opciones label:hover { background: rgba(52, 152, 219, 0.2); }
        .opciones input[type="radio"] { margin-right: 10px; }

        .btn-enviar { width: 100%; padding: 15px; background: linear-gradient(135deg, #e74c3c, #c0392b); color: #fff; border: none; border-radius: 10px; font-size: 1.2rem; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 20px; }
        .btn-enviar:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(231,76,60,0.4); }

        #resultados { display: none; margin-top: 30px; padding: 20px; background: rgba(46, 204, 113, 0.2); border-radius: 10px; text-align: center; border: 1px solid var(--color-exito); }
        #resultados h2 { color: var(--color-exito); margin-bottom: 10px; }
    </style>
</head>
<body>
    <nav>
        <a href="inicio.html" class="logo"><i class="fa-solid fa-microscope"></i> LabVirtual W</a>
    </nav>

    <main class="contenedor">
        <a href="fisica10_vectores_suma_resta.html" style="color:var(--color-fisica); text-decoration:none; display:block; margin-bottom:20px;">
            <i class="fa-solid fa-arrow-left"></i> Volver
        </a>

        <div class="evaluacion-container">
            <h1>Evaluación: Suma y Resta</h1>
            
            <form id="quizForm">
                <div class="pregunta">
                    <h3>1. Si \(\vec{A} = (2, 4)\) y \(\vec{B} = (3, -1)\), ¿Cuál es \(\vec{A} + \vec{B}\)?</h3>
                    <div class="opciones">
                        <label><input type="radio" name="q1" value="a"> (5, 3)</label>
                        <label><input type="radio" name="q1" value="b"> (-1, 5)</label>
                        <label><input type="radio" name="q1" value="c"> (6, -4)</label>
                    </div>
                </div>

                <div class="pregunta">
                    <h3>2. Si \(\vec{P} = (5, 5)\) y \(\vec{Q} = (2, 2)\), ¿Cuál es \(\vec{P} - \vec{Q}\)?</h3>
                    <div class="opciones">
                        <label><input type="radio" name="q2" value="a"> (7, 7)</label>
                        <label><input type="radio" name="q2" value="b"> (3, 3)</label>
                        <label><input type="radio" name="q2" value="c"> (-3, -3)</label>
                    </div>
                </div>

                <button type="button" class="btn-enviar" onclick="calificar()">Enviar Respuestas</button>
            </form>

            <div id="resultados">
                <h2>¡Evaluación Completada!</h2>
                <p id="puntajeTexto" style="font-size:1.2rem;"></p>
            </div>
        </div>
    </main>

    <script>
        function calificar() {
            let puntaje = 0;
            const form = document.getElementById('quizForm');
            
            if(form.q1.value === 'a') puntaje += 50;
            if(form.q2.value === 'b') puntaje += 50;
            
            if(!form.q1.value || !form.q2.value) {
                alert("Por favor responde todas las preguntas.");
                return;
            }

            form.style.display = 'none';
            const resultados = document.getElementById('resultados');
            resultados.style.display = 'block';
            document.getElementById('puntajeTexto').innerText = `Tu calificación es: ${puntaje} / 100`;
            
            if(puntaje < 100) {
                resultados.innerHTML += `<p style="margin-top:15px; font-size:0.9rem;">Te sugerimos repasar la suma y resta analítica de componentes y volver a intentarlo.</p>`;
            }
        }
    </script>
    <script src="profe-ia.js"></script>
</body>
</html>
